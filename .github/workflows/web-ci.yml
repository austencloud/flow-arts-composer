name: Web App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  card-render-parity:
    name: Composer and MCP Card Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: npm ci --prefix mcp-server --ignore-scripts
      - run: npm ci --prefix mcp-server-pkg --ignore-scripts
      - run: npm run build --prefix mcp-server-pkg
      - name: Canonical packaged assets must be current
        run: |
          git diff --exit-code -- mcp-server-pkg/assets
          test -z "$(git ls-files --others --exclude-standard -- mcp-server-pkg/assets)"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare Composer with source and installed MCP package
        run: npm run release:verify --prefix mcp-server-pkg
      - name: Retain live card parity comparisons
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-card-parity
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .artifacts/live-card-parity/
            tests/render-parity/__screenshots__/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-mcp-package
          include-hidden-files: true
          path: mcp-server-pkg/.release/

  validate:
    name: Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # Before `pnpm install`, not after: `postinstall` runs
      # `svelte-kit sync`, which is what generates the `$env/static/public`
      # declarations. Sync with no `.env` present emits a module with no
      # members, and `svelte-kit-sync-if-needed.mjs` then correctly skips the
      # re-sync -- its fingerprint covers route shape, `svelte.config.js` and
      # the Kit version, none of which moved. Every `$env/static/public` import
      # in a `.ts` file then fails `check:tsc`, which is a production outage
      # because the deploy is gated on this workflow.
      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate active spec queue
        run: pnpm run specs:check && pnpm run specs:test

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Type check (svelte-check)
        run: pnpm run check

      # svelte-check is not a substitute for the compiler: it goes through the
      # Svelte language service and has been observed finishing in ~2 s with
      # "0 errors" on this repo in CI, which is not a program it actually
      # checked. (Past 20 MB of .svelte files the language service drops every
      # project file; see the svelte-check-full job below.)
      # A plain tsc pass over the same tsconfig costs about a minute
      # and is what keeps the type backlog in src/ and tests/ from regrowing.
      # The gate reports every diagnostic and fails only on files this
      # tsconfig owns; dependencies and sibling workspace packages resolve to
      # raw .ts under `moduleResolution: Bundler` and are gated by
      # `build:packages` instead.
      - name: Type check (plain tsc)
        run: pnpm run check:tsc

      - name: Unit tests (Vitest)
        run: pnpm run test -- --run

      # Workspace packages have their own vitest configs, so the app's config
      # never sees them. 465 passing assertions sat outside CI entirely until
      # 2026-08-16, and sequence-engine had no test script to run at all.
      - name: Package tests (workspace vitest configs)
        run: pnpm run test:packages

      - name: Build
        run: pnpm run build

      # Unit tests prove the code; this proves the artifact. Catches the class
      # of bug where the build/trim pipeline eats part of the offline kit
      # (missing precache manifest, sw.js not copied, fonts trimmed) — invisible
      # to every test above because the code is fine.
      - name: Verify offline kit in build artifact
        run: pnpm run verify:offline

      # Public pages are meant to start without Firebase. One static import or
      # a chunk merge can put it back on a page's first download while the page
      # still works, so this reads the built chunk graph.
      - name: Verify public pages start without Firebase
        run: pnpm run verify:public-firebase

      # A red run on main is also a PRODUCTION OUTAGE, and that half is silent.
      # Deploy Pages (gated) fires on workflow_run and exits `skipped` when the
      # conclusion isn't success — no failure, no notification, just an absent
      # deploy. tkaflowarts.com then serves the last green build indefinitely
      # while main moves on. That has now happened twice (2026-08-04: five days
      # of commits stranded behind one jsdom Blob failure).
      #
      # Nothing here changes the gate. It makes the consequence legible in the
      # failure the developer is already looking at.
      - name: Say that production did not deploy
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "::error title=Production did NOT deploy::Web App CI failed on main, so Deploy Pages (gated) will skip and Cloudflare is never triggered. tkaflowarts.com keeps serving the last green build until this run is fixed and main is green again."
          {
            echo "## :rotating_light: Production did NOT deploy"
            echo
            echo "This run failed on \`main\`. \`Deploy Pages (gated)\` only fires the Cloudflare"
            echo "Deploy Hook when Web App CI concludes \`success\`, so it will exit \`skipped\`"
            echo "and **no production build is queued**."
            echo
            echo "\`tkaflowarts.com\` is serving the last green build — every commit on \`main\`"
            echo "since then is stranded, not just this one."
            echo
            echo "Fix this run and push; the deploy triggers itself once \`main\` is green."
          } >> "$GITHUB_STEP_SUMMARY"

  # Advisory: shows the type backlog `pnpm run check` cannot see. svelte-check
  # gives TypeScript a 20 MB budget for non-TypeScript files; the components
  # passed it on 2026-08-01, and past it the language service drops every
  # project file. `check:full` lifts the cap (tsconfig.check-full.json).
  #
  # Nothing in this job may fail the run, because the deploy is gated on it:
  # keep both continue-on-error flags, and keep the step timeout below the
  # job's (a job that times out is cancelled, which continue-on-error does not
  # cover). The check held 6.3 GB of heap on 2026-09-27, hence check:full's
  # 12 GB cap; ubuntu-latest has 16 GB for public repos, 8 GB for private.
  # Once the count reaches zero, give `check` this config and cap, and delete
  # this job.
  svelte-check-full:
    name: Full svelte-check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      # Before install, for the same `$env/static/public` reason as validate.
      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Type check (full svelte-check, size cap lifted)
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: pnpm run check:full 2>&1 | tee svelte-check-full.log

      - name: Report the backlog
        if: always()
        shell: bash
        run: |
          {
            echo "## Full svelte-check (advisory)"
            echo
            # CI turns on svelte-check's colors; -o keeps the codes out.
            grep -Eo "svelte-check found [0-9]+ errors? and [0-9]+ warnings?( in [0-9]+ files?)?" svelte-check-full.log ||
              echo "svelte-check did not finish; see the step log."
            echo
            echo "\`pnpm run check\` cannot see these: it stops at TypeScript's"
            echo "20 MB cap on .svelte files. Run \`pnpm run check:full\` locally."
          } >> "$GITHUB_STEP_SUMMARY"

  component-tests:
    name: Component Tests (browser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Component tests (Vitest browser mode)
        timeout-minutes: 5
        run: pnpm run test:components:ci
        continue-on-error: true # The broader component suite is still being hardened.

      - name: Critical QR regressions
        run: pnpm run test:qr-critical:components
