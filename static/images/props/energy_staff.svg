<?xml version="1.0" encoding="utf-8"?>
<!--
  Energy Staff: two curved energy blades on a wrapped grip, a Double Staff
  style. viewBox 300 x 90, hand pivot (150, 45), tips (23.6, 45) and
  (276.4, 45): staff's reach on both ends. Each blade bows 5 units off the
  axis and meets it again at the tip. The two ends are the same blade turned
  half a turn, so the staff balances and spins like a pinwheel.
  Color: #C8C8C8 (blades and grip windows) is the only paint that takes the
  hand color. The cutting edges are #FFF6E8, which selective coloring keeps.
  Metal is gradient-filled, so it never recolors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90">
<defs>
<linearGradient id="stfMetalSheen" x1="0" y1="37" x2="0" y2="53" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07080a"/><stop offset=".16" stop-color="#2e333c"/><stop offset=".3" stop-color="#7d8794"/><stop offset=".42" stop-color="#3a414c"/><stop offset=".72" stop-color="#14171c"/><stop offset="1" stop-color="#22262d"/></linearGradient>
<linearGradient id="stfChromeSheen" x1="0" y1="34.6" x2="0" y2="55.4" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c1f24"/><stop offset=".18" stop-color="#9aa4b2"/><stop offset=".28" stop-color="#f2f5f9"/><stop offset=".4" stop-color="#a3adba"/><stop offset=".6" stop-color="#454c57"/><stop offset=".86" stop-color="#15181d"/><stop offset="1" stop-color="#2f343c"/></linearGradient>
<linearGradient id="stfGuardSheen" x2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset=".25" stop-color="#8a94a2"/><stop offset=".4" stop-color="#e8edf3"/><stop offset=".55" stop-color="#5a626e"/><stop offset="1" stop-color="#101318"/></linearGradient>
<linearGradient id="stfGoldSheen" x2="1"><stop offset="0" stop-color="#3a2a0c"/><stop offset=".3" stop-color="#d9b25c"/><stop offset=".45" stop-color="#fff0c4"/><stop offset=".65" stop-color="#a8822f"/><stop offset="1" stop-color="#2a1d07"/></linearGradient>
<filter id="stfHalo" x="-30%" y="-150%" width="160%" height="400%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="7"/><feColorMatrix type="saturate" values="1.6"/></filter>
<filter id="stfBloom" x="-15%" y="-100%" width="130%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
<filter id="stfSoft" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="1"/></filter>
</defs>
