name = "tka-platform"
# Native Node crypto is required by firebase-admin service-account signing.
# 2026-08-04 enables the current Node compatibility runtime for Pages.
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

[vars]
PUBLIC_ENVIRONMENT = "production"
R2_PUBLIC_URL = "https://assets.tkaflowarts.com"
# Session-replay deep links only (posthog.ts buildSessionReplayUrl). Not a
# credential — the PostHog project id is public, and the key that can actually
# read the project is POSTHOG_PERSONAL_API_KEY, a dashboard-managed secret.
# This was set on the preview environment but not production, so replay links
# silently returned null in prod.
PUBLIC_POSTHOG_PROJECT_ID = "299320"
# Build-time flag for PostHog source maps (vite.config.ts build.sourcemap,
# scripts/upload-sourcemaps.js). Maps are made only when a PostHog key is also
# in the build environment, which is true for the production build alone.
# Cloudflare manages this project's plain variables from this file.
VITE_SOURCEMAP = "true"

[[r2_buckets]]
binding = "QR_VIDEOS"
bucket_name = "qr-videos"

[[r2_buckets]]
binding = "TKA_ASSETS"
bucket_name = "tka-assets"

# Native rate limiting (GA 2025-09, memcached-backed, shared across isolates).
# Fixes security-hardening F6 (in-memory limiter reset per Worker isolate).
# One binding per short-window preset in RATE_LIMITS; period must be 10 or 60.
# Counters are keyed per-request by withRateLimit (path + ip/uid). Provisioned
# automatically on deploy — no manual dashboard step. namespace_id is any unique
# positive integer string.
[[ratelimits]]
name = "RL_GENERAL"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

[[ratelimits]]
name = "RL_AI_CHAT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_AI_RENDER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_CARD_ISSUE"
namespace_id = "1005"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "RL_CARD_SCAN"
namespace_id = "1006"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_SOFTWARE_SUBMISSION"
namespace_id = "1007"

  [ratelimits.simple]
  limit = 4
  period = 60

[[ratelimits]]
name = "RL_SITE_VISIT"
namespace_id = "1008"

  [ratelimits.simple]
  limit = 10
  period = 60
