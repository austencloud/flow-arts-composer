<?xml version="1.0" encoding="utf-8"?>
<!-- Sword rethink: Knightly arming sword. Metal hardware (pommel/grip/guard) = st0 flat -> recolors to hand color. Blade = st1 gold kevlar wick, preserved. Sheen/edges via url() + stroke, both survive recolor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.3 64">
<style type="text/css">
	.st0{fill:#989498;}
	.st1{fill:#ffd540;}
</style>
<defs>
	<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.05" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.30" stop-color="#ffffff" stop-opacity="0.85"/>
		<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.05"/>
		<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
		<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
	</linearGradient>
	<linearGradient id="bladeSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.22" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.40" stop-color="#fffbe0" stop-opacity="0.95"/>
		<stop offset="0.52" stop-color="#ffffff" stop-opacity="0.1"/>
		<stop offset="0.66" stop-color="#6b4e00" stop-opacity="0"/>
		<stop offset="0.9" stop-color="#6b4e00" stop-opacity="0.6"/>
	</linearGradient>
</defs>

<!-- Blade (gold wick): double-edge taper to a point -->
<path class="st1" stroke="#3a2c00" stroke-width="1" stroke-linejoin="round"
	d="M292 23 L548 28.5 L566 32 L548 35.5 L292 41 Z"/>
<path fill="url(#bladeSheen)" d="M292 23 L548 28.5 L566 32 L548 35.5 L292 41 Z"/>

<!-- Grip: ringed cylinder -->
<rect class="st0" stroke="#141418" stroke-width="1.2" x="138" y="25.5" width="146" height="13" rx="6.5"/>
<rect fill="url(#sheen)" x="138" y="25.5" width="146" height="13" rx="6.5"/>
<g stroke="#141418" stroke-width="1.1" opacity="0.55">
	<line x1="162" y1="26" x2="162" y2="38"/>
	<line x1="186" y1="26" x2="186" y2="38"/>
	<line x1="210" y1="26" x2="210" y2="38"/>
	<line x1="234" y1="26" x2="234" y2="38"/>
	<line x1="258" y1="26" x2="258" y2="38"/>
</g>

<!-- Pommel: disc -->
<circle class="st0" stroke="#141418" stroke-width="1.2" cx="126" cy="32" r="13.5"/>
<circle fill="url(#sheen)" cx="126" cy="32" r="13.5"/>

<!-- Cross-guard: tall flared bar with quillon balls -->
<circle class="st0" stroke="#141418" stroke-width="1.1" cx="288" cy="9" r="5"/>
<circle class="st0" stroke="#141418" stroke-width="1.1" cx="288" cy="55" r="5"/>
<rect class="st0" stroke="#141418" stroke-width="1.3" x="280" y="9" width="16" height="46" rx="5"/>
<rect fill="url(#sheen)" x="280" y="9" width="16" height="46" rx="5"/>
</svg>
