<path d="M190 39.8L227.2 40.4L264.3 41L266 41.1L267.8 41.2L269.5 41.5L271.2 41.9L272.9 42.5L274.7 43.4L276.4 45L276.4 46L274.7 45.6L272.9 45.7L271.2 45.9L269.5 46.2L267.8 46.5L266 46.8L264.3 47.2L227.2 47.3L190 47.5Z" fill="#FFF6E8" opacity=".8" filter="url(#stfSoft)"/>
<path d="M190 40.3L227.2 40.9L264.3 41.5L266 41.6L267.8 41.7L269.5 42L271.2 42.4L272.9 43L274.7 43.9L276.4 45L276.4 45L274.7 45.2L272.9 44.8L271.2 44.4L269.5 44L267.8 43.7L266 43.6L264.3 43.5L227.2 42.9L190 42.3Z" fill="#FFF6E8"/>
