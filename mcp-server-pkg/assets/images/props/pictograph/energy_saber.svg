<?xml version="1.0" encoding="utf-8"?>
<!--
  Energy Saber: a straight energy katana, a Sword style.
  viewBox 620 x 96, hand pivot (310, 48) at the guard, blade tip (590, 48):
  sword's reach. A single-edged blade with an angled katana tip; the tip
  lands on the axis. Katana proportions: the grip is about as tall as the
  blade and about 40% of its length; the guard is 2.5 times the grip's height.
  Color: #C8C8C8 (blade and grip windows) is the only paint that takes the
  hand color. The cutting edge is #FFF6E8, which selective coloring keeps.
  Metal is gradient-filled, so it never recolors.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 96">
<defs>
<linearGradient id="sabMetalSheen" x1="0" y1="39" x2="0" y2="57" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#07080a"/><stop offset=".16" stop-color="#2e333c"/><stop offset=".3" stop-color="#7d8794"/><stop offset=".42" stop-color="#3a414c"/><stop offset=".72" stop-color="#14171c"/><stop offset="1" stop-color="#22262d"/></linearGradient>
<linearGradient id="sabChromeSheen" x1="0" y1="36.3" x2="0" y2="59.7" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1c1f24"/><stop offset=".18" stop-color="#9aa4b2"/><stop offset=".28" stop-color="#f2f5f9"/><stop offset=".4" stop-color="#a3adba"/><stop offset=".6" stop-color="#454c57"/><stop offset=".86" stop-color="#15181d"/><stop offset="1" stop-color="#2f343c"/></linearGradient>
<linearGradient id="sabGuardSheen" x2="1"><stop offset="0" stop-color="#0b0d10"/><stop offset=".25" stop-color="#8a94a2"/><stop offset=".4" stop-color="#e8edf3"/><stop offset=".55" stop-color="#5a626e"/><stop offset="1" stop-color="#101318"/></linearGradient>
<linearGradient id="sabGoldSheen" x2="1"><stop offset="0" stop-color="#3a2a0c"/><stop offset=".3" stop-color="#d9b25c"/><stop offset=".45" stop-color="#fff0c4"/><stop offset=".65" stop-color="#a8822f"/><stop offset="1" stop-color="#2a1d07"/></linearGradient>
<filter id="sabHalo" x="-30%" y="-150%" width="160%" height="400%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="10"/><feColorMatrix type="saturate" values="1.6"/></filter>
<filter id="sabBloom" x="-15%" y="-100%" width="130%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="sabSoft" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
