<?xml version="1.0" encoding="utf-8"?>
<!-- Sword: Claymore. Massive straight blade, forward-sloping quillons with ring terminals, wheel pommel. Hardware st0 -> recolors; gold wick st1 preserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.3 64">
<style type="text/css">
	.st0{fill:#989498;}
	.st1{fill:#ffd540;}
</style>
<defs>
	<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.05" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.30" stop-color="#ffffff" stop-opacity="0.85"/>
		<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.05"/>
		<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
		<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
	</linearGradient>
	<linearGradient id="bladeSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.38" stop-color="#fffbe0" stop-opacity="0.95"/>
		<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
		<stop offset="0.66" stop-color="#6b4e00" stop-opacity="0"/>
		<stop offset="0.9" stop-color="#6b4e00" stop-opacity="0.6"/>
	</linearGradient>
</defs>

<!-- Blade (gold wick): long heavy straight, tapered point -->
<path class="st1" stroke="#3a2c00" stroke-width="1" stroke-linejoin="round"
	d="M300 23 L548 28 L566 32 L548 36 L300 41 Z"/>
<path fill="url(#bladeSheen)" d="M300 23 L548 28 L566 32 L548 36 L300 41 Z"/>

<!-- Forward-sloping quillon bar with ring terminals -->
<circle class="st0" stroke="#141418" stroke-width="1.1" cx="296" cy="9" r="5.5"/>
<circle class="st0" stroke="#141418" stroke-width="1.1" cx="296" cy="55" r="5.5"/>
<path class="st0" stroke="#141418" stroke-width="1.3" stroke-linejoin="round"
	d="M276 12 L298 9 L298 55 L276 52 Z"/>
<path fill="url(#sheen)" d="M276 12 L298 9 L298 55 L276 52 Z"/>

<!-- Long two-hand grip with binding rings -->
<rect class="st0" stroke="#141418" stroke-width="1.2" x="150" y="26.5" width="126" height="11" rx="5.5"/>
<rect fill="url(#sheen)" x="150" y="26.5" width="126" height="11" rx="5.5"/>
<g stroke="#141418" stroke-width="1.1" opacity="0.5">
	<line x1="170" y1="27" x2="170" y2="37"/>
	<line x1="190" y1="27" x2="190" y2="37"/>
	<line x1="210" y1="27" x2="210" y2="37"/>
	<line x1="230" y1="27" x2="230" y2="37"/>
	<line x1="250" y1="27" x2="250" y2="37"/>
</g>

<!-- Wheel pommel -->
<circle class="st0" stroke="#141418" stroke-width="1.3" cx="135" cy="32" r="15"/>
<circle fill="url(#sheen)" cx="135" cy="32" r="15"/>
<circle fill="none" stroke="#141418" stroke-width="1.1" opacity="0.5" cx="135" cy="32" r="7"/>
</svg>
