<?xml version="1.0" encoding="utf-8"?>
<!-- Sword: Scimitar. Deep dramatic curve, wide belly near tip. Hardware st0 -> recolors; gold wick st1 preserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.3 64">
<style type="text/css">
	.st0{fill:#989498;}
	.st1{fill:#ffd540;}
</style>
<defs>
	<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.05" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.30" stop-color="#ffffff" stop-opacity="0.85"/>
		<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.05"/>
		<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
		<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
	</linearGradient>
	<linearGradient id="bladeSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.32" stop-color="#fffbe0" stop-opacity="0.95"/>
		<stop offset="0.48" stop-color="#ffffff" stop-opacity="0.1"/>
		<stop offset="0.64" stop-color="#6b4e00" stop-opacity="0"/>
		<stop offset="0.9" stop-color="#6b4e00" stop-opacity="0.6"/>
	</linearGradient>
</defs>

<!-- Blade (gold wick): deep curve, belly widens toward tip -->
<path class="st1" stroke="#3a2c00" stroke-width="1" stroke-linejoin="round"
	d="M292 31 C356 15 466 8 540 18 L566 29 C560 33 528 31 466 33
	   C398 35 340 41 292 40 Z"/>
<path fill="url(#bladeSheen)"
	d="M292 31 C356 15 466 8 540 18 L566 29 C560 33 528 31 466 33
	   C398 35 340 41 292 40 Z"/>

<!-- Oval guard -->
<ellipse class="st0" stroke="#141418" stroke-width="1.3" cx="287" cy="32" rx="7" ry="18"/>
<ellipse fill="url(#sheen)" cx="287" cy="32" rx="7" ry="18"/>

<!-- Grip -->
<rect class="st0" stroke="#141418" stroke-width="1.2" x="152" y="26" width="128" height="12" rx="6"/>
<rect fill="url(#sheen)" x="152" y="26" width="128" height="12" rx="6"/>

<!-- Angled pommel cap -->
<path class="st0" stroke="#141418" stroke-width="1.2" stroke-linejoin="round"
	d="M154 25 L140 27 C131 29 131 35 140 37 L154 39 Z"/>
<path fill="url(#sheen)" d="M154 25 L140 27 C131 29 131 35 140 37 L154 39 Z"/>
</svg>
