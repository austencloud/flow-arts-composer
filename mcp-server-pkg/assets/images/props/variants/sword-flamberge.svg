<?xml version="1.0" encoding="utf-8"?>
<!-- Sword rethink: Flamberge / flame-wave blade. Metal hardware (pommel/grip/guard) = st0 flat -> recolors to hand color. Undulating blade = st1 gold kevlar wick, preserved. Sheen/edges via url() + stroke, both survive recolor. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.3 64">
<style type="text/css">
	.st0{fill:#989498;}
	.st1{fill:#ffd540;}
</style>
<defs>
	<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.05" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.30" stop-color="#ffffff" stop-opacity="0.85"/>
		<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.05"/>
		<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
		<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
	</linearGradient>
	<linearGradient id="bladeSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.4" stop-color="#fffbe0" stop-opacity="0.9"/>
		<stop offset="0.54" stop-color="#ffffff" stop-opacity="0.12"/>
		<stop offset="0.68" stop-color="#6b4e00" stop-opacity="0"/>
		<stop offset="0.92" stop-color="#6b4e00" stop-opacity="0.62"/>
	</linearGradient>
</defs>

<!-- Blade (gold wick): undulating flamberge edges, taper to point -->
<path class="st1" stroke="#3a2c00" stroke-width="1" stroke-linejoin="round"
	d="M296 25 Q326 18 356 25 Q386 32 416 25 Q446 18 476 25 Q506 32 540 28 L568 32
	   L540 36 Q506 32 476 39 Q446 46 416 39 Q386 32 356 39 Q326 46 296 39 Z"/>
<path fill="url(#bladeSheen)"
	d="M296 25 Q326 18 356 25 Q386 32 416 25 Q446 18 476 25 Q506 32 540 28 L568 32
	   L540 36 Q506 32 476 39 Q446 46 416 39 Q386 32 356 39 Q326 46 296 39 Z"/>

<!-- Guard: swept pointed-oval lens -->
<path class="st0" stroke="#141418" stroke-width="1.3" stroke-linejoin="round"
	d="M287 8 C298 19 298 45 287 56 C276 45 276 19 287 8 Z"/>
<path fill="url(#sheen)" d="M287 8 C298 19 298 45 287 56 C276 45 276 19 287 8 Z"/>

<!-- Grip -->
<rect class="st0" stroke="#141418" stroke-width="1.2" x="150" y="26" width="130" height="12" rx="6"/>
<rect fill="url(#sheen)" x="150" y="26" width="130" height="12" rx="6"/>
<g stroke="#141418" stroke-width="1" opacity="0.5">
	<line x1="172" y1="26" x2="172" y2="38"/>
	<line x1="196" y1="26" x2="196" y2="38"/>
	<line x1="220" y1="26" x2="220" y2="38"/>
	<line x1="244" y1="26" x2="244" y2="38"/>
</g>

<!-- Pommel: teardrop -->
<path class="st0" stroke="#141418" stroke-width="1.2" stroke-linejoin="round"
	d="M150 26 L138 28 C126 30 126 34 138 36 L150 38 C145 33 145 31 150 26 Z"/>
<path fill="url(#sheen)" d="M150 26 L138 28 C126 30 126 34 138 36 L150 38 C145 33 145 31 150 26 Z"/>
</svg>
