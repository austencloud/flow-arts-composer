<?xml version="1.0" encoding="utf-8"?>
<!-- Sword: Khopesh. Straight base hooking into a forward sickle. Hardware st0 -> recolors; gold wick st1 preserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.3 64">
<style type="text/css">
	.st0{fill:#989498;}
	.st1{fill:#ffd540;}
</style>
<defs>
	<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.05" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.30" stop-color="#ffffff" stop-opacity="0.85"/>
		<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.05"/>
		<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
		<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
	</linearGradient>
	<linearGradient id="bladeSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.12" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.34" stop-color="#fffbe0" stop-opacity="0.95"/>
		<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
		<stop offset="0.66" stop-color="#6b4e00" stop-opacity="0"/>
		<stop offset="0.9" stop-color="#6b4e00" stop-opacity="0.6"/>
	</linearGradient>
</defs>

<!-- Blade (gold wick): straight then hooks up and forward like a sickle -->
<path class="st1" stroke="#3a2c00" stroke-width="1" stroke-linejoin="round"
	d="M294 27 L382 27 C444 27 502 21 548 11 L562 8 C558 17 542 26 514 31
	   C470 38 420 38 382 38 L294 38 Z"/>
<path fill="url(#bladeSheen)"
	d="M294 27 L382 27 C444 27 502 21 548 11 L562 8 C558 17 542 26 514 31
	   C470 38 420 38 382 38 L294 38 Z"/>

<!-- Guard -->
<rect class="st0" stroke="#141418" stroke-width="1.3" x="282" y="20" width="11" height="24" rx="3"/>
<rect fill="url(#sheen)" x="282" y="20" width="11" height="24" rx="3"/>

<!-- Grip -->
<rect class="st0" stroke="#141418" stroke-width="1.2" x="152" y="26" width="130" height="12" rx="6"/>
<rect fill="url(#sheen)" x="152" y="26" width="130" height="12" rx="6"/>

<!-- Pommel -->
<circle class="st0" stroke="#141418" stroke-width="1.2" cx="141" cy="32" r="11"/>
<circle fill="url(#sheen)" cx="141" cy="32" r="11"/>
</svg>
