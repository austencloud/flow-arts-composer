<?xml version="1.0" encoding="utf-8"?>
<!-- Sword: Falchion / cleaver. Broad single-edge blade widening to a clipped tip. Hardware st0 -> recolors; gold wick st1 preserved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572.3 64">
<style type="text/css">
	.st0{fill:#989498;}
	.st1{fill:#ffd540;}
</style>
<defs>
	<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.05" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.30" stop-color="#ffffff" stop-opacity="0.85"/>
		<stop offset="0.46" stop-color="#ffffff" stop-opacity="0.05"/>
		<stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
		<stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
	</linearGradient>
	<linearGradient id="bladeSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
		<stop offset="0.22" stop-color="#ffffff" stop-opacity="0"/>
		<stop offset="0.40" stop-color="#fffbe0" stop-opacity="0.95"/>
		<stop offset="0.54" stop-color="#ffffff" stop-opacity="0.1"/>
		<stop offset="0.68" stop-color="#6b4e00" stop-opacity="0"/>
		<stop offset="0.92" stop-color="#6b4e00" stop-opacity="0.6"/>
	</linearGradient>
</defs>

<!-- Blade (gold wick): widening cleaver with clipped tip -->
<path class="st1" stroke="#3a2c00" stroke-width="1" stroke-linejoin="round"
	d="M294 25 L520 21 L562 24 L566 31 L548 43 L294 41 Z"/>
<path fill="url(#bladeSheen)" d="M294 25 L520 21 L562 24 L566 31 L548 43 L294 41 Z"/>

<!-- Guard -->
<rect class="st0" stroke="#141418" stroke-width="1.3" x="280" y="17" width="13" height="30" rx="3"/>
<rect fill="url(#sheen)" x="280" y="17" width="13" height="30" rx="3"/>

<!-- Grip -->
<rect class="st0" stroke="#141418" stroke-width="1.2" x="148" y="25" width="134" height="14" rx="7"/>
<rect fill="url(#sheen)" x="148" y="25" width="134" height="14" rx="7"/>

<!-- Pommel -->
<circle class="st0" stroke="#141418" stroke-width="1.2" cx="138" cy="32" r="12"/>
<circle fill="url(#sheen)" cx="138" cy="32" r="12"/>
</svg>
