# Project defaults survive changes to the shared user default. Explicit
# per-task model/effort choices still take precedence.
model = "gpt-6-sol"
model_reasoning_effort = "medium"

# Summarize history before it repeatedly approaches the full model window.
model_auto_compact_token_limit = 120000
tool_output_token_limit = 4000

[agents]
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "medium"
