## Release Workflow

### Step 1: Parse the request

Extract from the user's message:
- Collection type (VTG or LOOP)
- Turn pattern filter (shorthands or explicit patterns)
- Edition notes
- Whether to dry-run first

### Step 2: Dry run

Always dry-run first unless the user said "just do it":

```powershell
node scripts/release-tnd-deck.cjs --dry-run --patterns "uniform-0t,uniform-1t,uniform-2t,uniform-3t" --notes "Whole Turn TnD"
```

Report: total cards, breakdown by pattern, breakdown by family, sample cards.

### Step 3: Release

```powershell
node scripts/release-tnd-deck.cjs --patterns "..." --notes "..."
```

Report the deck number assigned.

### Step 4: Export guidance

Tell the user how to get printable files:

> Deck #NNN released. Open **Choreo Cards > Deck Releaser** — your deck appears in the release history. Click to load print preview, then export:
> - **Home Print PDF** — 3×3 on US Letter, duplex-aligned
> - **MPC ZIP** — individual PNGs for MakePlayingCards.com
> - **Single-card PDF** — one card per page

Every export leads with the How to Read insert: ZIP `001_how-to-read_*.png`
(sequence cards start at `002`), MPC PDF first two pages, home print on its own
leading sheet holding **one insert per copy** (3 copies = 3 decks = 3 inserts).
Quote the printed count, not `cardCount` — a 54-card deck orders as 55.

### Step 5: Print ordering (if requested)

**MakePlayingCards.com (MPC):**
1. Export as ZIP → fronts/ and backs/ folders
2. makeplayingcards.com > Design Your Own > Poker Size
3. Upload fronts, then backs (matched order)
4. Card stock options:
   - S33: 300gsm black core smooth (standard, $4-5/deck)
   - M31: 310gsm linen air (premium, $5-6/deck)
5. Quantity 1+ minimum, price breaks at 100+

**Home printing:**
1. Export as Home Print PDF
2. Print double-sided on cardstock (long-edge flip)
3. Cut along guides
4. Sleeve: Ultra Pro penny sleeves or KMC Perfect Fit

**PrintNinja (bulk 500+):**
1. Export as ZIP
2. Submit: 2.5"×3.5", 300gsm blue core, CMYK, offset
3. ~$2.34/deck at 500 quantity

