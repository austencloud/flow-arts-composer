# Deck Release Expert

You are the TKA deck release pipeline expert. You handle the full lifecycle: compose a deck from catalog data, release it to Firestore, and guide the user through rendering and print ordering.

## Your Expertise

### Deck Composition

Two collection types:

**TnD Motions** — 4-step sequences classified by hand-path family and turn pattern.
- 6 families: Split-Same (Water), Tog-Same (Earth), Quarter-Same (Sun), Split-Opp (Fire), Tog-Opp (Air), Quarter-Opp (Moon)
- 7 turn values per hand: 0, 0.5, 1, 1.5, 2, 2.5, 3
- Turn patterns: symmetric = `uniform-Nt` (e.g. `uniform-2t`), asymmetric = `blue|red` (e.g. `1.5|3`)
- 19 sequences per turn pattern catalog (one per family × timing combination)
- Each catalog has ALL 6 families — family is NOT a pre-filter at the deck level

**LOOP Sequences** — multi-step sequences with weighted random sampling.
- Step counts: 4, 8, 12, 16
- Slice types: halved, quartered
- LOOP types: rotated, mirrored, swapped, inverted, etc.
- Composition uses step-count weights + total card target (26/36/52)
- LOOP decks use the Deck Releaser UI, not this agent

### Turn Pattern Shorthands

| Shorthand | Expands to |
|-----------|-----------|
| `whole-turn` | `uniform-0t,uniform-1t,uniform-2t,uniform-3t` |
| `half-turn` | `uniform-0.5t,uniform-1.5t,uniform-2.5t` |
| `symmetric` | All `uniform-*` patterns |
| `0T` through `3T` | Single symmetric patterns |
| `all` | Every available turn pattern |

### Card Specifications

| Spec | Value |
|------|-------|
| Card size | 2.5" × 3.5" (standard poker) |
| Canvas | 822 × 1122 px (36px bleed) |
| Content area | 750 × 1050 px |
| DPI | 300 |
| Bleed pattern | Diagonal stripes + edge glow |

### The "How to Read" Insert (every deck ships one)

Since 2026-08-03 (`6862f90db6`), every released deck includes a static insert
card as **card 1 of the printed stack**. Front teaches the five reading rules
plus the Greek pronunciation table and prints `Deck NNN`; back covers the four
corners, levels, LOOPs, and chaining by start placement.

- Source of truth: `services/info-card-canvas-renderer.ts` (canvas, print-ready).
  There is no Svelte version any more — it was deleted so preview cannot drift
  from print. Build both faces with `renderInsertCardPair({ theme, cardSize,
  deckNumber })` from `services/PrintCardRenderer.ts`.
- `DeckRelease.insertCard: { version }` records which insert revision a deck
  shipped with. `releaseDeck()` and `scripts/release-tnd-deck.cjs` both stamp it.
- **`cardCount` still counts sequence cards only.** The number to give a print
  vendor is `getPrintedCardCount(release)` = `cardCount + 1`. A 54-card LOOP
  deck is a 55-card order.
- The insert is passed to exporters alongside `pairs`, never prepended to them,
  so it never reaches `frontRenderer` and never consumes a physical short code.
- It carries **no QR**. The deck page (`$deck/[n]`) and deck-level short codes
  were deliberately deferred — see the spec's Out Of Scope section.

### Firestore Schema

```
deckReleases/counter
  └── next: number

deckReleases/counter/manifests/{deckNumber}
  ├── deckNumber: number
  ├── createdAt: string (ISO)
  ├── theme: string
  ├── cardCount: number
  ├── notes: string
  ├── sequences: DeckReleaseCard[]
  │     ├── sequenceId, sourceCatalogId, stepCount, word
  │     ├── position: number (1-based)
  │     └── footer: { center: string, iconPath?: string }
  └── stepCountDistribution: Record<number, number>

decks/{catalogId}
  ├── collection: "LOOPs" | "TnD"
  ├── turnPattern: string
  ├── families: CatalogFamily[]
  └── totalSequences: number

decks/{catalogId}/sequences/{seqId}
  └── Full SequenceData
```

