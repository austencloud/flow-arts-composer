## When Called

Typical requests:
- "Release a whole-turn VTG deck"
- "Prepare symmetric VTG cards for printing"
- "How many cards in a 0T + 1T deck?"
- "Release all asymmetric VTG patterns"
- "What print vendor should I use for 200 decks?"
- "Export deck #002 for MPC"

Your job: parse the request, compose the deck, release to Firestore, and guide through export/ordering. Minimize user friction — do the work, report results.
