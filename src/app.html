    <!-- crypto.randomUUID polyfill for iOS Safari PWA and older WebKit builds.
         crypto.randomUUID requires iOS Safari 15.4+ and a secure context; in
         some PWA/standalone contexts it's undefined, which breaks the create
         module (46 call sites) and causes the "restoring sequence" loop.
         crypto.getRandomValues has been universally supported for years. -->
    <script>
      (function () {
        if (typeof crypto === "undefined") return;
        if (typeof crypto.randomUUID === "function") return;
        if (typeof crypto.getRandomValues !== "function") return;
        var hex = [];
        for (var i = 0; i < 256; i++)
          hex.push((i + 0x100).toString(16).slice(1));
        var polyfill = function () {
          var b = crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          return (
            hex[b[0]] +
            hex[b[1]] +
            hex[b[2]] +
            hex[b[3]] +
            "-" +
            hex[b[4]] +
            hex[b[5]] +
            "-" +
            hex[b[6]] +
            hex[b[7]] +
            "-" +
            hex[b[8]] +
            hex[b[9]] +
            "-" +
            hex[b[10]] +
            hex[b[11]] +
            hex[b[12]] +
            hex[b[13]] +
            hex[b[14]] +
            hex[b[15]]
          );
        };
        try {
          crypto.randomUUID = polyfill;
        } catch (e) {
          try {
            Object.defineProperty(crypto, "randomUUID", {
              value: polyfill,
              configurable: true,
              writable: true,
            });
          } catch (e2) {
            // Can't patch the Crypto object - callers will still fail.
          }
        }
      })();
    </script>

    <!-- Dev mode: kill stale service workers BEFORE any module scripts load.
         hooks.client.ts also does this, but it runs too late; a stale SW can
         intercept the navigation request that loads the page in the first place,
         creating a deadlock where the page never loads and the SW never unregisters. -->
    <script>
      if (
        (window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1") &&
        "serviceWorker" in navigator
      ) {
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              })
            );
          }),
          "caches" in window
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key);
                  })
                );
              })
            : Promise.resolve(),
        ]).then(function () {
          // Capacitor serves packaged assets from https://localhost. A worker
          // left by an older build can keep this page on obsolete chunk hashes
          // even after a new APK is installed. Reload once after detaching it.
          if (
            navigator.serviceWorker.controller &&
            !sessionStorage.getItem("tka-local-sw-cleared")
          ) {
            sessionStorage.setItem("tka-local-sw-cleared", "1");
            window.location.reload();
          }
        });
      }
    </script>

    <!-- The root transform removes app-only boot blocks after this tiny
         connection-aware bootstrap has classified the homepage. -->
    <script>
      (function () {
        if (window.location.pathname !== "/") return;

        window.__tkaIsLanding = true;
        var connection =
          navigator.connection ||
          navigator.mozConnection ||
          navigator.webkitConnection;
        // Data-saver ONLY — never a bandwidth estimate. This flag defers
        // hydration to window.load, withholds every module preload, holds the
        // deferred stylesheets, and drops the brand fonts back to system
        // fallbacks. Chrome reports effectiveType "3g" at well under 1 Mbps on
        // gigabit desktops, so an effectiveType/downlink/rtt test hands a
        // healthy visitor the degraded page — wrong typeface and all. Mirrors
        // prefersReducedData() in shared/platform/network-conditions.ts, which
        // was narrowed for exactly this reason after the same guess froze every
        // launchpad tile on its placeholder poster.
        window.__tkaLandingConstrained = Boolean(
          connection && connection.saveData
        );
      })();
    </script>

        if (isLanding) {
          // Mark landing mode early for loading bar skip below
          window.__tkaIsLanding = true;
        } else {
          // App mode: inject preconnect hints dynamically
          var origins = [
            "https://firebaseapp.com",
            "https://firestore.googleapis.com",
            "https://www.googleapis.com",
            "https://accounts.google.com",
            "https://apis.google.com",
            "https://firebasestorage.googleapis.com",
            "https://storage.googleapis.com",
          ];
          var dnsPrefetch = [
            "https://www.google-analytics.com",
            "https://www.googletagmanager.com",
            "https://firebaseinstallations.googleapis.com",
          ];
          var head = document.head;
          origins.forEach(function (url) {
            var link = document.createElement("link");
            link.rel = "preconnect";
            link.href = url;
            link.crossOrigin = "";
            head.appendChild(link);
          });
          dnsPrefetch.forEach(function (url) {
            var link = document.createElement("link");
            link.rel = "dns-prefetch";
            link.href = url;
            head.appendChild(link);
          });

          // ============================================================
          // SPECULATION RULES API (Chromium 111+)
          // Prerender the likely-next app routes at browser idle time.
          // Graceful fallback: browsers that don't support <script type="speculationrules">
          // silently ignore the tag. Zero cost for Safari/Firefox.
          //
          // "moderate" eagerness = only when user shows intent (hover, focus).
          // Avoids burning bandwidth on pages the user never visits.
          // ============================================================
          if (
            HTMLScriptElement.supports &&
            HTMLScriptElement.supports("speculationrules")
          ) {
            var rules = document.createElement("script");
            rules.type = "speculationrules";
            rules.textContent = JSON.stringify({
              prerender: [
                {
                  source: "document",
                  where: {
                    and: [
                      { href_matches: "/*" },
                      { not: { href_matches: "/sequence/*" } },
                      { not: { href_matches: "/q/*" } },
                      { not: { href_matches: "/embed*" } },
                      { not: { selector_matches: '[rel~="external"]' } },
                    ],
                  },
                  eagerness: "moderate",
                },
              ],
            });
            head.appendChild(rules);
          }
        }
      })();
    </script>

    <!-- CACHE MANAGEMENT - Clear stale cache on startup (non-blocking) -->
    <script>
      // ⚡ PERFORMANCE: Run cache cleanup asynchronously to not block page load
      setTimeout(function () {
        try {
          // Clear specific cache keys to prevent quota issues
          // IMPORTANT: Be specific! Broad patterns like "options" will break user preferences
          const cacheKeyPatterns = [
            "preloaded_options", // Pictograph preload cache
            "all_preloaded_options", // Full preload cache
            "preloaded_options_meta", // Preload metadata
            "_cache", // Keys ending in _cache
            "-cache", // Keys with -cache
          ];

          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key) {
              // Only clear if key matches a specific cache pattern
              const isCache = cacheKeyPatterns.some(
                (pattern) =>
                  key === pattern ||
                  key.endsWith(pattern) ||
                  key.includes("_cache_") ||
                  key.includes("-cache-")
              );
              if (isCache) {
                keysToRemove.push(key);
              }
            }
          }

          keysToRemove.forEach((key) => {
            localStorage.removeItem(key);
          });
        } catch (error) {
          console.warn("Failed to check/clear cache on startup:", error);
        }
      }, 0);

      // Development Storage Cleanup Utilities
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        window.clearTKAStorage = function () {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith("tka-")) {
              keys.push(key);
            }
          }
          keys.forEach((key) => {
            localStorage.removeItem(key);
          });

          // Clear other TKA-related keys
          const otherKeys = [
            "optionPickerSortMethod",
            "lastSelectedTab",
            "preloaded_options",
            "all_preloaded_options",
            "tka-modern-web-settings",
          ];
          otherKeys.forEach((key) => {
            if (localStorage.getItem(key)) {
              localStorage.removeItem(key);
            }
          });
        };

        window.clearSequences = function () {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (
              key &&
              (key.includes("-sequence") || key.includes("-sequences"))
            ) {
              keys.push(key);
            }
          }
          keys.forEach((key) => {
            localStorage.removeItem(key);
          });
        };
      }
    </script>

    <!-- SMART CONSOLE FORWARDER - DEVELOPMENT ONLY -->
    <script>
      (function () {
        // Only enable in development
        const isDev =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";
        if (!isDev) return;

        // Store original console methods
        const originalConsole = {
          log: console.log,
          error: console.error,
          warn: console.warn,
          info: console.info,
        };

        // Filter out noisy logs
        function shouldForwardLog(args) {
          const message = args.join(" ");

          // Skip empty or whitespace-only messages
          if (!message.trim()) return false;

          // Skip single numbers without context
          if (args.length === 1 && typeof args[0] === "number") return false;

          // Skip very short messages that are likely debug noise
          if (message.length < 3) return false;

          // Skip repetitive debug messages
          const skipPatterns = [
            /^[0-9]+$/, // Just numbers
            /^\s*$/, // Just whitespace
            /^undefined$/,
            /^null$/,
            /^\[morph\]/, // Local transition profiler: never measure its own POST
            /^\[FrameStats\]/, // High-rate animation profiler stays browser-local
          ];

          return !skipPatterns.some((pattern) => pattern.test(message));
        }

        // Send to server (throttled)
        let lastLogTime = 0;
        const LOG_THROTTLE_MS = 100; // Minimum time between logs

        function sendToServer(level, args) {
          const now = Date.now();
          if (now - lastLogTime < LOG_THROTTLE_MS) return;
          lastLogTime = now;

          if (!shouldForwardLog(args)) return;

          // ULTRA SIMPLE: Just convert everything to string and capture what the browser actually shows
          let message = "";
          try {
            // Capture the exact same output that would appear in browser console
            const parts = [];
            for (let i = 0; i < args.length; i++) {
              const arg = args[i];
              if (arg && typeof arg === "object" && arg.message) {
                // This looks like an Error object - get the actual error message
                parts.push(`${arg.name || "Error"}: ${arg.message}`);
                if (arg.stack) {
                  parts.push(`\nStack: ${arg.stack}`);
                }
              } else {
                // For everything else, just use String() which is what console does
                parts.push(String(arg));
              }
            }
            message = parts.join(" ");
          } catch (e) {
            message = `[Console forwarding error: ${e.message}] Raw args: ${args.length} items`;
          }

          fetch("/api/console-log", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              level,
              message,
              timestamp: new Date().toISOString(),
            }),
          }).catch(() => {}); // Ignore fetch errors
        }

        // Override console methods with smart filtering
        console.log = function (...args) {
          originalConsole.log.apply(console, args);
          sendToServer("LOG", args);
        };

        console.error = function (...args) {
          originalConsole.error.apply(console, args);
          sendToServer("ERROR", args);
        };

        console.warn = function (...args) {
          originalConsole.warn.apply(console, args);
          sendToServer("WARN", args);
        };

        console.info = function (...args) {
          originalConsole.info.apply(console, args);
          sendToServer("INFO", args);
        };

        // Capture global errors (always forward these)
        window.addEventListener("error", function (event) {
          // Suppress benign ResizeObserver errors (common with container queries)
          // These occur when ResizeObserver callbacks trigger more resizes in the same frame
          // This is expected behavior with CSS container queries and doesn't indicate a problem
          if (event.message && event.message.includes("ResizeObserver loop")) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false; // Silently ignore this benign error
          }

          console.error("🚨 GLOBAL ERROR:", {
            message: event.message,
            filename: event.filename,
            line: event.lineno,
            column: event.colno,
            stack: event.error?.stack,
          });
        });

        // Capture unhandled promise rejections (always forward these)
        window.addEventListener("unhandledrejection", function (event) {
          console.error("🚨 UNHANDLED PROMISE REJECTION:", event.reason);
        });
      })();
    </script>

    <!-- BACKGROUND PRELOADER - Load saved background immediately to prevent FART (Flash of inAccurate coloR Theme) -->
    <!-- This script is render-blocking and runs BEFORE any Svelte/JS code -->
    <script>
      (function () {
        try {
          // Load saved settings
          var settingsKey = "tka-modern-web-settings";
          var stored = localStorage.getItem(settingsKey);
          var root = document.documentElement;

          // Theme colors for each background type - MUST match BACKGROUND_THEME_COLORS
          var BACKGROUND_THEME_COLORS = {
            pride: ["#8b1c1c", "#6b6b00", "#f43f5e", "#fda4af"],
            winter: ["#1e3a5f", "#3b82f6", "#93c5fd"],
            cosmic: ["#1e1b4b", "#4338ca", "#818cf8"],
            ocean: ["#0c4a6e", "#0891b2", "#22d3ee"],
            ember: ["#7c2d12", "#ea580c", "#fb923c"],
            blossom: ["#831843", "#db2777", "#f9a8d4"],
            forest: ["#0d3320", "#166534", "#22c55e", "#bef264"],
            autumn: ["#92400e", "#d97706", "#dc2626", "#78350f"],
          };

          // Calculate relative luminance (WCAG formula)
          function calculateLuminance(hex) {
            var color = hex.replace("#", "");
            var r = parseInt(color.substring(0, 2), 16) / 255;
            var g = parseInt(color.substring(2, 4), 16) / 255;
            var b = parseInt(color.substring(4, 6), 16) / 255;
            var rL =
              r <= 0.03928 ? r / 12.92 : Math.pow((r + 0.055) / 1.055, 2.4);
            var gL =
              g <= 0.03928 ? g / 12.92 : Math.pow((g + 0.055) / 1.055, 2.4);
            var bL =
              b <= 0.03928 ? b / 12.92 : Math.pow((b + 0.055) / 1.055, 2.4);
            return 0.2126 * rL + 0.7152 * gL + 0.0722 * bL;
          }

          // Calculate gradient luminance (weighted average)
          function calculateGradientLuminance(colors) {
            if (!colors || colors.length === 0) return 0;
            if (colors.length === 1) return calculateLuminance(colors[0]);
            var first = calculateLuminance(colors[0]) * 0.5;
            var last = calculateLuminance(colors[colors.length - 1]) * 0.2;
            var middle = 0;
            if (colors.length > 2) {
              var middleColors = colors.slice(1, -1);
              for (var i = 0; i < middleColors.length; i++) {
                middle += calculateLuminance(middleColors[i]);
              }
              middle *= 0.3 / middleColors.length;
            }
            return first + middle + last;
          }

          // Extract accent color from gradient
          function extractAccent(colors) {
            if (!colors || colors.length === 0) return "#38bdf8";
            if (colors.length === 1) return colors[0];
            if (colors.length === 3) return colors[1];
            return colors[1] || colors[0];
          }

          // ── Accent contrast floor (keep in sync with background-theme-calculator.ts) ──
          // Light: 7:1 (AAA) vs #c8c8c2 (darkest light surface). Dark: 4.5:1 vs the
          // effective near-black panel (#16161f). Lightness-only walk preserves hue.
          function contrastRatio(hexA, hexB) {
            var a = calculateLuminance(hexA);
            var b = calculateLuminance(hexB);
            var hi = Math.max(a, b);
            var lo = Math.min(a, b);
            return (hi + 0.05) / (lo + 0.05);
          }
          function hexToHsl(hex) {
            var c = hex.replace("#", "");
            var r = parseInt(c.substring(0, 2), 16) / 255;
            var g = parseInt(c.substring(2, 4), 16) / 255;
            var b = parseInt(c.substring(4, 6), 16) / 255;
            var max = Math.max(r, g, b),
              min = Math.min(r, g, b);
            var l = (max + min) / 2;
            if (max === min) return { h: 0, s: 0, l: l };
            var d = max - min;
            var s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
