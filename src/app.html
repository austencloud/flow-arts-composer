    <!-- crypto.randomUUID polyfill for iOS Safari PWA and older WebKit builds.
         crypto.randomUUID requires iOS Safari 15.4+ and a secure context; in
         some PWA/standalone contexts it's undefined, which breaks the create
         module (46 call sites) and causes the "restoring sequence" loop.
         crypto.getRandomValues has been universally supported for years. -->
    <script>
      (function () {
        if (typeof crypto === "undefined") return;
        if (typeof crypto.randomUUID === "function") return;
        if (typeof crypto.getRandomValues !== "function") return;
        var hex = [];
        for (var i = 0; i < 256; i++)
          hex.push((i + 0x100).toString(16).slice(1));
        var polyfill = function () {
          var b = crypto.getRandomValues(new Uint8Array(16));
          b[6] = (b[6] & 0x0f) | 0x40;
          b[8] = (b[8] & 0x3f) | 0x80;
          return (
            hex[b[0]] +
            hex[b[1]] +
            hex[b[2]] +
            hex[b[3]] +
            "-" +
            hex[b[4]] +
            hex[b[5]] +
            "-" +
            hex[b[6]] +
            hex[b[7]] +
            "-" +
            hex[b[8]] +
            hex[b[9]] +
            "-" +
            hex[b[10]] +
            hex[b[11]] +
            hex[b[12]] +
            hex[b[13]] +
            hex[b[14]] +
            hex[b[15]]
          );
        };
        try {
          crypto.randomUUID = polyfill;
        } catch (e) {
          try {
            Object.defineProperty(crypto, "randomUUID", {
              value: polyfill,
              configurable: true,
              writable: true,
            });
          } catch (e2) {
            // Can't patch the Crypto object - callers will still fail.
          }
        }
      })();
    </script>

    <!-- Dev mode: kill stale service workers BEFORE any module scripts load.
         hooks.client.ts also does this, but it runs too late; a stale SW can
         intercept the navigation request that loads the page in the first place,
         creating a deadlock where the page never loads and the SW never unregisters. -->
    <script>
      if (
        (window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1") &&
        "serviceWorker" in navigator
      ) {
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              })
            );
          }),
          "caches" in window
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key);
                  })
                );
              })
            : Promise.resolve(),
        ]).then(function () {
          // Capacitor serves packaged assets from https://localhost. A worker
          // left by an older build can keep this page on obsolete chunk hashes
          // even after a new APK is installed. Reload once after detaching it.
          if (
            navigator.serviceWorker.controller &&
            !sessionStorage.getItem("tka-local-sw-cleared")
          ) {
            sessionStorage.setItem("tka-local-sw-cleared", "1");
            window.location.reload();
          }
        });
      }
    </script>

    <!-- The root transform removes app-only boot blocks after this tiny
         connection-aware bootstrap has classified the homepage. -->
    <script>
      (function () {
        if (window.location.pathname !== "/") return;

        window.__tkaIsLanding = true;
        var connection =
          navigator.connection ||
          navigator.mozConnection ||
          navigator.webkitConnection;
        // Data-saver ONLY — never a bandwidth estimate. This flag defers
        // hydration to window.load, withholds every module preload, holds the
        // deferred stylesheets, and drops the brand fonts back to system
        // fallbacks. Chrome reports effectiveType "3g" at well under 1 Mbps on
        // gigabit desktops, so an effectiveType/downlink/rtt test hands a
        // healthy visitor the degraded page — wrong typeface and all. Mirrors
        // prefersReducedData() in shared/platform/network-conditions.ts, which
        // was narrowed for exactly this reason after the same guess froze every
        // launchpad tile on its placeholder poster.
        window.__tkaLandingConstrained = Boolean(
          connection && connection.saveData
        );
      })();
    </script>

    <!-- Capture the PWA install prompt before MobileFullscreenManager exists.
         Chrome fires beforeinstallprompt early in page load, but the manager
         is only created lazily when the first caller reaches for it (root
         layout defers that to requestIdleCallback). Any event that fires
         before the manager exists would otherwise be lost, leaving
         canInstallPWA() false even though Chrome offers an install. -->
    <script>
      (function () {
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          window.__tkaInstallPrompt = e;
        });
        window.addEventListener("appinstalled", function () {
          window.__tkaInstallPrompt = null;
        });
      })();
    </script>

    <!-- Composer handoff. Public pages open the app with a full reload (they
         boot without Firebase), so the two documents meet in a cross-document
         view transition (opted in by the critical <style> below). When a
         public page leaves for /create through a Composer link, the link the
         visitor pressed travels to the centre and becomes the boot capsule
         while the page recedes behind it. The shared name is set only inside
         these two listeners, and cleared after, so no other navigation
         inherits it. Outside the app-only blocks: "/" needs pageswap too.
         The arrival leaves window.__tkaHandoff and tka:handoff performance
         marks for verification; localStorage "tka-handoff-slow" (a number)
         stretches the timing for frame-by-frame review. Nothing is logged. -->
    <script>
      (function () {
        var KEY = "tka-composer-handoff";
        var NAME = "composer-cta";
        var TYPE = "tka-handoff";
        var named = null;
        // The link the visitor just activated (keyboard Enter fires click
        // too). Safari's pageswap may arrive without event.activation, so its
        // href is also the fallback destination.
        var lastLink = null;

        function reducedMotion() {
          return Boolean(
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
          );
        }
        function clearName() {
          if (named) named.style.viewTransitionName = "";
          named = null;
          var root = document.documentElement;
          root.removeAttribute("data-tka-cta-travel");
          root.style.removeProperty("--tka-cta-from");
        }
        // The travel runs on the compositor: the group keeps the capsule's
        // size and only its transform animates (see the CSS). It starts as
        // the capsule scaled to the pressed link's height and centred on that
        // link, so the old snapshot, kept at its own aspect ratio, sits
        // exactly on the button's box. The end is the group's own position.
        function setTravel(source, target) {
          if (!source || !target || !(source.h > 0) || !(target.h > 0)) return;
          var scale = source.h / target.h;
          var x = source.x + (source.w - target.w * scale) / 2;
          var root = document.documentElement;
          root.style.setProperty(
            "--tka-cta-from",
            "translate(" + x + "px, " + source.y + "px) scale(" + scale + ")"
          );
          root.setAttribute("data-tka-cta-travel", "");
        }
        function viewportRect(element) {
          var box = element.getBoundingClientRect();
          return {
            x: box.left,
            y: box.top,
            w: box.width,
            h: box.height,
            vw: window.innerWidth,
            vh: window.innerHeight,
          };
        }
        function onScreen(rect) {
          return (
            rect.w > 0 &&
            rect.h > 0 &&
            rect.y + rect.h > 0 &&
            rect.x + rect.w > 0 &&
            rect.y < rect.vh &&
            rect.x < rect.vw
          );
        }
        function opensComposer(href) {
          try {
            var url = new URL(href, window.location.href);
            return (
              url.origin === window.location.origin &&
              url.pathname === "/create"
            );
          } catch (e) {
            return false;
          }
        }
        function addType(transition) {
          try {
            transition.types.add(TYPE);
          } catch (e) {}
        }
        // Verification only: stretch the handoff timing by this factor.
        function applySlowMotion() {
          var factor = NaN;
          try {
            factor = parseFloat(localStorage.getItem("tka-handoff-slow"));
          } catch (e) {}
          if (factor > 0 && isFinite(factor)) {
            document.documentElement.style.setProperty(
              "--tka-handoff-slow",
              String(factor)
            );
          }
        }
        function stamp(name) {
          try {
            performance.mark(name);
          } catch (e) {}
          return performance.now();
        }

        document.addEventListener(
          "click",
          function (event) {
            lastLink =
              (event.target.closest && event.target.closest("a[href]")) || null;
          },
          true
        );

        window.addEventListener("pageswap", function (event) {
          clearName();
          try {
            sessionStorage.removeItem(KEY);
          } catch (e) {}
          if (!event.viewTransition || !window.__tkaIsLanding) return;
          if (reducedMotion()) {
            event.viewTransition.skipTransition();
            return;
          }
          var entry = event.activation && event.activation.entry;
          var href = (entry && entry.url) || (lastLink && lastLink.href) || "";
          if (!opensComposer(href)) return;
          applySlowMotion();
          var source = null;
          if (
            lastLink &&
            lastLink.isConnected &&
            opensComposer(lastLink.href)
          ) {
            var rect = viewportRect(lastLink);
            if (onScreen(rect)) source = rect;
          }
          if (source) {
            lastLink.style.viewTransitionName = NAME;
            named = lastLink;
            addType(event.viewTransition);
          }
          try {
            sessionStorage.setItem(
              KEY,
              JSON.stringify({
                mode: source ? "morph" : "fade",
                at: Date.now(),
                source: source,
              })
            );
          } catch (e) {}
        });

        window.addEventListener("pagereveal", function (event) {
          // Also runs when a page returns from the back/forward cache.
          clearName();
          var record = null;
          try {
            var saved = sessionStorage.getItem(KEY);
            sessionStorage.removeItem(KEY);
            record = saved ? JSON.parse(saved) : null;
          } catch (e) {}
          var transition = event.viewTransition || null;
          if (transition && reducedMotion()) {
            transition.skipTransition();
            return;
          }
          if (!record || (record.mode !== "morph" && record.mode !== "fade")) {
            return;
          }
          applySlowMotion();
          var screen = document.getElementById("app-loading");
          var capsule = document.getElementById("boot-capsule");
          var shown = Boolean(
            screen && capsule && screen.style.display !== "none"
          );

          // Instrumentation: readyMs and finishedMs count from the reveal.
          var revealedAt = stamp("tka:handoff:reveal");
          var handoff = {
            mode: record.mode,
            swapToRevealMs: Date.now() - record.at,
            source: record.source || null,
            target: shown ? viewportRect(capsule) : null,
            readyMs: null,
            finishedMs: null,
          };
          window.__tkaHandoff = handoff;
          if (transition) {
            transition.ready.then(
              function () {
                handoff.readyMs = stamp("tka:handoff:ready") - revealedAt;
              },
              function () {}
            );
            transition.finished.then(
              function () {
                handoff.finishedMs = stamp("tka:handoff:finished") - revealedAt;
                try {
                  performance.measure(
                    "tka:handoff",
                    "tka:handoff:reveal",
                    "tka:handoff:finished"
                  );
                } catch (e) {}
              },
              function () {}
            );
          }

          if (!transition || record.mode !== "morph" || !shown) return;
          capsule.style.viewTransitionName = NAME;
          named = capsule;
          addType(transition);
          setTravel(record.source, handoff.target);
          transition.finished.then(clearName, clearName);
        });
      })();
    </script>

    <!-- 🚀 Preconnect to external origins for faster requests (app mode only) -->
    <!-- Landing visitors don't need Firebase/Google APIs - skip these to save ~500ms -->
    <script>
      (function () {
        var p = window.location.pathname;
        // KEEP IN SYNC with PUBLIC_PATH_PREFIXES + LANDING_PATHS in
        // src/config/domains.ts (detectSiteMode). Any public/marketing route the
        // layout boots in landing-lite mode (no Firebase/DI) MUST appear here, or
        // the #app-loading boot bar is never dismissed (landing mode never calls
        // __tkaLoadProgress(100)) and the page sits behind it until the 15s
        // safety-net timeout.
        var isLanding =
          p === "/" ||
          p === "/landing" ||
          p.startsWith("/embed") ||
          p.startsWith("/q/") ||
          p.startsWith("/sequence/") ||
          p.startsWith("/profile/") ||
          p.startsWith("/demo") ||
          p.startsWith("/test/smart-collections") ||
          p.startsWith("/test/sequence-actions") ||
          p.startsWith("/test/sequence-viewer-transitions") ||
          p.startsWith("/test/prop-size-audit") ||

          p.startsWith("/test/viewer-3d") ||
          p.startsWith("/test/museum-") ||
          p.startsWith("/test/sidebar-props") ||
          p.startsWith("/test/environment-transition") ||
          p.startsWith("/test/film-director") ||
          p.startsWith("/guide") ||
          p.startsWith("/1989") ||
          p.startsWith("/1995") ||
          p.startsWith("/1998") ||
          p.startsWith("/2003") ||
          p.startsWith("/privacy") ||
          p.startsWith("/terms") ||
          p.startsWith("/about") ||
          p.startsWith("/roots") ||
          p.startsWith("/delete-account") ||
          p.startsWith("/store") ||
          p.startsWith("/shop") ||
          p.startsWith("/support") ||
          p.startsWith("/notation") ||
          p.startsWith("/history") ||
          p.startsWith("/composer") ||
          p.startsWith("/timing-and-direction") ||
          p.startsWith("/tricks") ||
          p.startsWith("/atlas") ||
          p.startsWith("/learn/staff-spinning-choreography") ||
          p.startsWith("/learn/concepts") ||
          p.startsWith("/shape-engine") ||
          p.startsWith("/faq");
        if (isLanding) {
          // Mark landing mode early for loading bar skip below
          window.__tkaIsLanding = true;
        } else {
          // App mode: inject preconnect hints dynamically
          var origins = [
            "https://firebaseapp.com",
            "https://firestore.googleapis.com",
            "https://www.googleapis.com",
            "https://accounts.google.com",
            "https://apis.google.com",
            "https://firebasestorage.googleapis.com",
            "https://storage.googleapis.com",
          ];
          var dnsPrefetch = [
            "https://www.google-analytics.com",
            "https://www.googletagmanager.com",
            "https://firebaseinstallations.googleapis.com",
          ];
          var head = document.head;
          origins.forEach(function (url) {
            var link = document.createElement("link");
            link.rel = "preconnect";
            link.href = url;
            link.crossOrigin = "";
            head.appendChild(link);
          });
          dnsPrefetch.forEach(function (url) {
            var link = document.createElement("link");
            link.rel = "dns-prefetch";
            link.href = url;
            head.appendChild(link);
          });

          // ============================================================
          // SPECULATION RULES API (Chromium 111+)
          // Prerender the likely-next app routes at browser idle time.
          // Graceful fallback: browsers that don't support <script type="speculationrules">
          // silently ignore the tag. Zero cost for Safari/Firefox.
          //
          // "moderate" eagerness = only when user shows intent (hover, focus).
          // Avoids burning bandwidth on pages the user never visits.
          // ============================================================
          if (
            HTMLScriptElement.supports &&
            HTMLScriptElement.supports("speculationrules")
          ) {
            var rules = document.createElement("script");
            rules.type = "speculationrules";
            rules.textContent = JSON.stringify({
              prerender: [
                {
                  source: "document",
                  where: {
                    and: [
                      { href_matches: "/*" },
                      { not: { href_matches: "/sequence/*" } },
                      { not: { href_matches: "/q/*" } },
                      { not: { href_matches: "/embed*" } },
                      { not: { selector_matches: '[rel~="external"]' } },
                    ],
                  },
                  eagerness: "moderate",
                },
              ],
            });
            head.appendChild(rules);
          }
        }
      })();
    </script>

    <!-- CACHE MANAGEMENT - Clear stale cache on startup (non-blocking) -->
    <script>
      // ⚡ PERFORMANCE: Run cache cleanup asynchronously to not block page load
      setTimeout(function () {
        try {
          // Clear specific cache keys to prevent quota issues
          // IMPORTANT: Be specific! Broad patterns like "options" will break user preferences
          const cacheKeyPatterns = [
            "preloaded_options", // Pictograph preload cache
            "all_preloaded_options", // Full preload cache
            "preloaded_options_meta", // Preload metadata
            "_cache", // Keys ending in _cache
            "-cache", // Keys with -cache
          ];

          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key) {
              // Only clear if key matches a specific cache pattern
              const isCache = cacheKeyPatterns.some(
                (pattern) =>
                  key === pattern ||
                  key.endsWith(pattern) ||
                  key.includes("_cache_") ||
                  key.includes("-cache-")
              );
              if (isCache) {
                keysToRemove.push(key);
              }
            }
          }

          keysToRemove.forEach((key) => {
            localStorage.removeItem(key);
          });
        } catch (error) {
          console.warn("Failed to check/clear cache on startup:", error);
        }
      }, 0);

      // Development Storage Cleanup Utilities
      if (
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
      ) {
        window.clearTKAStorage = function () {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith("tka-")) {
              keys.push(key);
            }
          }
          keys.forEach((key) => {
            localStorage.removeItem(key);
          });

          // Clear other TKA-related keys
          const otherKeys = [
            "optionPickerSortMethod",
            "lastSelectedTab",
            "preloaded_options",
            "all_preloaded_options",
            "tka-modern-web-settings",
          ];
          otherKeys.forEach((key) => {
            if (localStorage.getItem(key)) {
              localStorage.removeItem(key);
            }
          });
        };

        window.clearSequences = function () {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (
              key &&
              (key.includes("-sequence") || key.includes("-sequences"))
            ) {
              keys.push(key);
            }
          }
          keys.forEach((key) => {
            localStorage.removeItem(key);
          });
        };
      }
    </script>

    <!-- SMART CONSOLE FORWARDER - DEVELOPMENT ONLY -->
    <script>
      (function () {

        const isDev =

          window.location.hostname === "127.0.0.1";
        if (!isDev) return;

        // Store original console methods
        const originalConsole = {
