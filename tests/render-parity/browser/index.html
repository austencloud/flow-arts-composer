<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Composer and MCP card comparison</title>
  <style>
    body { font: 16px system-ui; margin: 24px; background: #ddd; color: #111; }
    section { margin: 24px 0; }
    .images { display: flex; gap: 16px; align-items: start; }
    figure { margin: 0; flex: 1; min-width: 0; }
    img { width: 100%; height: auto; background: white; }
    pre { white-space: pre-wrap; }
  </style>
  <h1>Composer and MCP card comparison</h1>
  <p id="status">Rendering the same inputs in Chromium and Node…</p>
  <main id="results"></main>
  <script type="module">
    if (location.protocol === "file:") {
      document.querySelector("#status").textContent = "This is the rendering tool's source page. Open the saved card-profiles.html review for an offline side-by-side comparison, or run the review server and open its HTTP address.";
    } else {
      import("./main.ts").catch(error => {
        document.querySelector("#status").textContent = "Unable to load the comparison tool: " + error;
      });
    }
  </script>
</html>
